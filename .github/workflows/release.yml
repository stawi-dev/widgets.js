name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo run test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Build all packages
        run: pnpm turbo run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Set each publishable package's version to match the git tag
      # so npm publish uses the tag version, not the static package.json value.
      - name: Stamp package versions from tag
        run: |
          for pkg in packages/*/package.json shared/*/package.json; do
            [ -f "$pkg" ] || continue
            private=$(node -p "require('./$pkg').private || false")
            [ "$private" = "true" ] && continue
            pnpm --filter "$(node -p "require('./$pkg').name")" exec \
              npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          done

      - name: Publish to npm
        run: |
          for pkg in packages/*/package.json shared/*/package.json; do
            [ -f "$pkg" ] || continue
            private=$(node -p "require('./$pkg').private || false")
            [ "$private" = "true" ] && continue
            name=$(node -p "require('./$pkg').name")
            dir=$(dirname "$pkg")
            pnpm --filter "$name" publish --access public --no-git-checks
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release ${{ github.ref_name }} already exists, skipping."
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
