name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm Trusted Publishing — the runner mints an OIDC token
  # that npm verifies against the trusted-publisher rule configured on
  # each package (stawi-dev/widgets.js, workflow release.yml). No
  # long-lived NPM_TOKEN secret is involved.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing + --provenance requires npm >= 11.5.1.
          # Node 22 ships with npm 10.9, so we bump npm explicitly below.
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm bundled with Node 22 is 10.9.x; OIDC trusted publishing
      # requires 11.5.1+. `npm install -g npm@latest` on top of the
      # existing npm sometimes leaves a half-replaced bundle (the
      # node_modules tree for the new npm is partly seeded with the
      # old npm's bundled deps and crashes with MODULE_NOT_FOUND on
      # things like `promise-retry`). Wipe the bundled npm dir first,
      # then install cleanly.
      - name: Upgrade npm to OIDC-capable version
        run: |
          sudo rm -rf "$(npm root -g)/npm"
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo run test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Build all packages
        run: pnpm turbo run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Set each publishable package's version to match the git tag
      # so npm publish uses the tag version, not the static package.json value.
      - name: Stamp package versions from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in packages/*/package.json shared/*/package.json; do
            [ -f "$pkg" ] || continue
            private=$(node -p "require('./$pkg').private || false")
            [ "$private" = "true" ] && continue
            pnpm --filter "$(node -p "require('./$pkg').name")" exec \
              npm version "$VERSION" --no-git-tag-version --allow-same-version
          done

      # Two-step publish: pack first with pnpm (rewrites `workspace:*`
      # specifiers to the resolved version), then publish the tarballs
      # with the npm CLI so the OIDC trusted-publishing handshake +
      # provenance attestation actually run. `npm publish` from a source
      # directory leaves `workspace:*` literally in the tarball — that
      # bricked @stawi/profile@1.1.1, which shipped an unresolvable
      # `"@stawi/auth-runtime": "workspace:*"` dependency. pnpm 9 (this
      # workspace's packageManager) doesn't forward --provenance to
      # `npm publish`, so we can't just use `pnpm publish` either.
      #
      # Order: pack ALL packages into RUNNER_TEMP first, then publish
      # them from that staging dir. Keeps the source tree clean and
      # makes the publish loop's exit behaviour easy to reason about.
      - name: Pack packages (rewrites workspace: protocols)
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for pkg in packages/*/package.json shared/*/package.json; do
            [ -f "$pkg" ] || continue
            private=$(node -p "require('./$pkg').private || false")
            [ "$private" = "true" ] && continue
            dir=$(dirname "$pkg")
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -la "$RUNNER_TEMP/tarballs"

      - name: Publish tarballs via trusted publishing
        run: |
          for tarball in "$RUNNER_TEMP/tarballs"/*.tgz; do
            [ -f "$tarball" ] || continue
            npm publish "$tarball" --provenance --access public
          done

      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --generate-notes
          fi
